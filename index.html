<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Santa Model Test</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#55aaff;
}

#info{
    position:fixed;
    top:15px;
    left:15px;
    z-index:100;
    padding:14px 18px;
    background:rgba(0,0,0,.85);
    color:white;
    font-family:Arial,sans-serif;
    font-size:16px;
    border-radius:8px;
}
</style>
</head>

<body>

<div id="info">🎅 Loading Santa...</div>

<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

<script>

const scene = new THREE.Scene();

scene.background =
    new THREE.Color(0x55aaff);


// CAMERA

const camera =
    new THREE.PerspectiveCamera(
        50,
        window.innerWidth /
        window.innerHeight,
        0.001,
        1000000
    );

camera.position.set(
    0,
    2,
    15
);


// RENDERER

const renderer =
    new THREE.WebGLRenderer({
        antialias:true
    });

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);

renderer.outputEncoding =
    THREE.sRGBEncoding;

document.body.appendChild(
    renderer.domElement
);


// LIGHTS

scene.add(
    new THREE.AmbientLight(
        0xffffff,
        10
    )
);

const light =
    new THREE.DirectionalLight(
        0xffffff,
        10
    );

light.position.set(
    10,
    20,
    20
);

scene.add(light);


// TEST CUBE

const cube =
    new THREE.Mesh(
        new THREE.BoxGeometry(
            2,
            2,
            2
        ),
        new THREE.MeshBasicMaterial({
            color:0xff0000
        })
    );

cube.position.x = 6;

scene.add(cube);


// LOAD SANTA

const loader =
    new THREE.GLTFLoader();

loader.load(

    "./santa.gltf",

    function(gltf){

        const original =
            gltf.scene;


        const allMeshes = [];


        original.traverse(
            function(object){

                if(object.isMesh){

                    allMeshes.push(
                        object
                    );

                }

            }
        );


        console.log(
            "TOTAL MESHES:",
            allMeshes.length
        );


        // FIND THE NORMAL-SIZED OBJECTS
        // AND IGNORE HUGE BASEPLATE

        const meshInfo = [];


        allMeshes.forEach(
            function(mesh){

                mesh.updateWorldMatrix(
                    true,
                    false
                );


                const box =
                    new THREE.Box3()
                        .setFromObject(mesh);


                const size =
                    new THREE.Vector3();

                box.getSize(size);


                const largest =
                    Math.max(
                        size.x,
                        size.y,
                        size.z
                    );


                meshInfo.push({
                    mesh:mesh,
                    size:largest,
                    box:box
                });

            }
        );


        console.log(
            "MESH SIZES:",
            meshInfo
        );


        // SORT FROM SMALLEST TO LARGEST

        meshInfo.sort(
            function(a,b){
                return a.size - b.size;
            }
        );


        // USE THE 90th PERCENTILE AS A
        // REASONABLE SIZE LIMIT

        const sizes =
            meshInfo.map(
                function(item){
                    return item.size;
                }
            );


        const limitIndex =
            Math.floor(
                sizes.length * 0.90
            );


        const sizeLimit =
            sizes[
                Math.max(
                    0,
                    limitIndex - 1
                )
            ];


        console.log(
            "BASEPLATE FILTER SIZE:",
            sizeLimit
        );


        // CREATE CLEAN GROUP

        const santa =
            new THREE.Group();

        scene.add(
            santa
        );


        let kept = 0;


        meshInfo.forEach(
            function(info){

                // Ignore enormous objects

                if(
                    info.size >
                    sizeLimit * 3
                ){

                    console.log(
                        "IGNORING LARGE MESH:",
                        info.mesh.name,
                        info.size
                    );

                    return;
                }


                const clone =
                    info.mesh.clone(true);


                info.mesh.matrixWorld.decompose(
                    clone.position,
                    clone.quaternion,
                    clone.scale
                );


                clone.material =
                    new THREE.MeshBasicMaterial({
                        color:0xff00ff,
                        side:THREE.DoubleSide
                    });


                clone.frustumCulled =
                    false;


                santa.add(
                    clone
                );


                kept++;

            }
        );


        console.log(
            "KEPT MESHES:",
            kept
        );


        // CLEAN BOUNDING BOX

        let box =
            new THREE.Box3()
                .setFromObject(santa);


        const size =
            new THREE.Vector3();

        box.getSize(size);


        const center =
            new THREE.Vector3();

        box.getCenter(center);


        console.log(
            "CLEAN SIZE:",
            size
        );


        // CENTER

        santa.position.set(
            -center.x,
            -center.y,
            -center.z
        );


        // SCALE

        const biggest =
            Math.max(
                size.x,
                size.y,
                size.z
            );


        let scale =
            5 / biggest;


        if(
            !isFinite(scale) ||
            scale <= 0
        ){

            scale = 1;

        }


        santa.scale.set(
            scale,
            scale,
            scale
        );


        // MOVE SLIGHTLY FORWARD

        santa.position.z = 0;


        document.getElementById(
            "info"
        ).textContent =
            "🎅 Filtered Santa — " +
            kept +
            " meshes";


        console.log(
            "🎅 BASEPLATE FILTER COMPLETE"
        );

    },

    undefined,

    function(error){

        console.error(
            error
        );

        document.getElementById(
            "info"
        ).textContent =
            "❌ Santa failed";

    }
);


// ANIMATION

function animate(){

    requestAnimationFrame(
        animate
    );

    cube.rotation.x +=
        0.01;

    cube.rotation.y +=
        0.01;

    renderer.render(
        scene,
        camera
    );

}

animate();


// RESIZE

window.addEventListener(
    "resize",
    function(){

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);

</script>

</body>
</html>
